<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        button {
            cursor: pointer;
            margin: 2px;
        }

        .blue {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

<h1>Todo App</h1>

<!-- TODO INPUT SECTION -->
<div>

    <input type="text" id="taskInput" placeholder="Enter task">
    <input type="date" id="dateInput">

    <button onclick="addTask()">Add Task</button>

</div>

<br>

<!-- TASK TABLE -->
<table border="1" cellpadding="10">

    <thead>
        <tr>
            <th>Task</th>
            <th>Due Date</th>
            <th>Status</th>
            <th>Completed Time</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="taskTable"></tbody>

</table>

<script src="script.js"></script>

</body>
</html>
